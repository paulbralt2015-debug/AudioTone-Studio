name: Build AudioTone Studio

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Deploy Qt
        run: windeployqt --release --compiler-runtime build/Release/AudioToneStudio.exe

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: AudioToneStudio-Windows
          path: build/Release/**
          if-no-files-found: error
