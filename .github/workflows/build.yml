name: Build AudioTone Studio

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia

      - name: Configure project
        run: cmake -S . -B build -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release

      - name: Build application
        run: cmake --build build

      - name: Deploy Qt libraries
        run: windeployqt --release --compiler-runtime build/AudioToneStudio.exe

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: AudioToneStudio-Windows
          path: build/**
          if-no-files-found: error
